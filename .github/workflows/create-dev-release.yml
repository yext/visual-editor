name: Create Dev Release

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

jobs:
  create-dev-release:
    if: >-
      github.repository == 'yext/visual-editor' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'labeled' && github.event.label.name == 'create-dev-release') ||
      (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'create-dev-release')))
    runs-on: ubuntu-latest
    concurrency:
      group: create-dev-release-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Check out PR head
        uses: actions/checkout@v4.1.6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: 24.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Visual Editor
        run: pnpm --dir packages/visual-editor run build

      - name: Publish preview package
        env:
          npm_config_ignore_scripts: "true"
        run: pnpm exec pkg-pr-new publish ./packages/visual-editor --no-template --json "$RUNNER_TEMP/visual-editor-preview.json"

      - name: Show preview install command
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          import { join } from "node:path";

          const metadataPath = join(process.env.RUNNER_TEMP, "visual-editor-preview.json");
          const { packages } = JSON.parse(readFileSync(metadataPath, "utf8"));
          const preview = packages.find(({ name }) => name === "@yext/visual-editor");
          const expectedUrl = `https://pkg.pr.new/${process.env.GITHUB_REPOSITORY}/@yext/visual-editor@${process.env.PR_HEAD_SHA}`;
          if (preview?.url !== expectedUrl) {
            throw new Error("pkg.pr.new did not return a Visual Editor preview URL for the PR head commit.");
          }

          appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            `### Install the Visual Editor preview\n\n\`\`\`sh\nnpm install ${preview.url}\n\`\`\`\n`
          );
          NODE
