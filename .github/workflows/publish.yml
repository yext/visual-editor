# This file must be .github/workflows/publish.yml for Trusted Publishing
name: Publish Package

on:
  push:
    tags:
      - "*"

permissions:
  id-token: write # Required for OIDC

jobs:
  publish:
    if: github.repository == 'yext/visual-editor'
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Set node version to 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://registry.npmjs.org/
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Update npm
        # npm 11.5.1 or later is required for Trusted Publishing.
        run: npm install -g npm@11

      - name: Verify package version and get npm tag
        id: get_npm_tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: pnpm run ci-verify-publish "$REF_NAME"

      - name: Publish
        id: publish
        env:
          NPM_TAG: ${{ steps.get_npm_tag.outputs.npm_tag }}
        run: cd packages/visual-editor && pnpm publish --access public --tag "$NPM_TAG" --no-git-checks

      - name: Set node version for major-version tags
        if: steps.get_npm_tag.outputs.versioned_npm_tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/

      - name: Set npm version for major-version tags
        if: steps.get_npm_tag.outputs.versioned_npm_tag != ''
        # npm 12.2.0 supports npm dist-tag with Trusted Publishing.
        run: npm install -g npm@12.2.0

      - name: Update major-version tag
        if: steps.get_npm_tag.outputs.versioned_npm_tag != ''
        id: update_release_tags
        env:
          PACKAGE_VERSION: ${{ steps.get_npm_tag.outputs.package_version }}
        run: pnpm run ci-update-release-tags "$PACKAGE_VERSION"

      - name: Report major-version tag update failure
        if: failure() && steps.publish.outcome == 'success'
        env:
          PACKAGE_VERSION: ${{ steps.get_npm_tag.outputs.package_version }}
        run: |
          echo "::error::Package $PACKAGE_VERSION is published, but its major-version tag update failed. Run pnpm run ci-update-release-tags $PACKAGE_VERSION --recover with npm tag-write access. Do not publish the package again."
